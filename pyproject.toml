[project]
name = "zurich-commuting-delay-analyzer"
version = "0.1.0"
description = "Reactive Zurich commuting delay analyzer with marimo"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "marimo>=0.11.0",
  "pandas>=2.2.0",
  "httpx>=0.28.0",
  "altair>=5.4.0",
  "pyarrow>=23.0.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = false
